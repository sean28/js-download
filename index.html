<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>URL file direct download tool</title>
<style>
  body{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;max-width:820px;margin:40px auto;padding:0 16px}
  h2{margin:0 0 12px}
  .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input[type="text"]{flex:1;min-width:300px;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px}
  input[type="text"]:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 16px;cursor:pointer}
  .btn.secondary{background:#6b7280}
  .small{color:#6b7280;font-size:12px}
  progress{width:100%;height:12px;appearance:none}
  .log{font-family:ui-monospace,Consolas,monospace;border:1px dashed #e5e7eb;border-radius:10px;padding:10px;white-space:pre-wrap;max-height:220px;overflow:auto}
</style>
</head>
<body>
  <h2>URL file direct download tool</h2>
  <div class="card">
    <div class="row">
      <label for="url" class="small">文件 URL</label>
      <input id="url" type="text"
        value="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
        placeholder="粘贴任意可直链下载的 URL，如 https://cdn.jsdelivr.net/.../file.js" />
    </div>
    <div class="row" style="margin-top:10px">
      <label for="name" class="small">保存文件名（可选）</label>
      <input id="name" type="text" placeholder="留空则自动从 URL 推断文件名" />
    </div>
    <div class="row" style="margin-top:10px">
      <button id="go" class="btn">下载</button>
      <button id="test" class="btn secondary">仅测试可达性（HEAD）</button>
    </div>
    <div style="margin-top:12px">
      <progress id="bar" value="0" max="1" style="display:none"></progress>
      <div id="meta" class="small"></div>
    </div>
  </div>

  <div class="card">
    <div class="small" style="margin-bottom:6px">日志</div>
    <div id="log" class="log"></div>
  </div>

<script>
const $ = s => document.querySelector(s);
const urlEl = $('#url');
const nameEl = $('#name');
const goBtn = $('#go');
const testBtn = $('#test');
const bar = $('#bar');
const meta = $('#meta');
const logEl = $('#log');

function log(msg){ logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; }

function inferName(url, headers){
  // 优先 content-disposition
  const cd = headers?.get?.('content-disposition') || '';
  const m = cd.match(/filename\*=UTF-8''([^;]+)|filename="([^"]+)"|filename=([^;]+)/i);
  if(m){ return decodeURIComponent(m[1] || m[2] || m[3]).trim(); }
  try{
    const u = new URL(url);
    const p = u.pathname.split('/').filter(Boolean);
    const last = p[p.length - 1] || 'download.bin';
    return last.split('?')[0] || 'download.bin';
  }catch(_){ return 'download.bin'; }
}

async function headOnly() {
  log('== HEAD 测试开始 ==');
  meta.textContent = '';
  bar.style.display = 'none';
  const url = urlEl.value.trim();
  if(!url){ log('请输入 URL'); return; }
  try{
    const res = await fetch(url, { method: 'HEAD', mode: 'cors' });
    log(`状态: ${res.status} ${res.statusText}`);
    log(`Content-Type: ${res.headers.get('content-type')}`);
    log(`Content-Length: ${res.headers.get('content-length')}`);
    log(`Accept-Ranges: ${res.headers.get('accept-ranges')}`);
    meta.textContent = `状态 ${res.status}，类型 ${res.headers.get('content-type')||'未知'}`;
  }catch(e){
    log('HEAD 失败：' + (e?.message || e));
    meta.textContent = 'HEAD 测试失败（可能不支持 CORS 或被拦截）。';
  }
  log('== HEAD 测试结束 ==');
}

async function download(){
  log('== 下载开始 ==');
  meta.textContent = '';
  bar.style.display = 'block';
  bar.value = 0; bar.max = 1;
  const url = urlEl.value.trim();
  if(!url){ log('请输入 URL'); return; }

  try{
    const res = await fetch(url, { method: 'GET', mode: 'cors' });
    if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const total = Number(res.headers.get('content-length')) || 0;
    const fname = (nameEl.value.trim() || inferName(url, res.headers)) || 'download.bin';
    meta.textContent = `准备下载：${fname}  大小：${ total ? (Math.round(total/1024/1024*100)/100+' MB') : '未知' }`;

    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value);
      received += value.length;
      if(total){
        bar.max = total;
        bar.value = received;
      }else{
        // 没有长度就做假进度
        bar.value = (bar.value + 0.02) % 1;
      }
    }

    const blob = new Blob(chunks, { type: res.headers.get('content-type') || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);

    log(`下载完成：${fname}，合计 ${(received/1024/1024).toFixed(2)} MB`);
    meta.textContent = `下载完成：${fname}`;
  }catch(e){
    log('下载失败：' + (e?.message || e));
    meta.textContent = '下载失败（可能是 CORS 限制、直链受限或网络异常）。';
  }finally{
    if(!bar.max || bar.max === 1) bar.style.display = 'none';
  }
  log('== 下载结束 ==');
}

testBtn.addEventListener('click', headOnly);
goBtn.addEventListener('click', download);
</script>
</body>
</html>
